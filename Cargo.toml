[package]
name = "exec-helper"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.50", features = ["derive", "string"] }
console = { version = "0.16.1", features = ["windows-console-colors"] }
indicatif = { version = "0.18.1", features = ["tokio"] }
itertools = "0.14.0"
lets_find_up = "0.0.4"
serde = {version = "1.0.228", features = ["serde_derive"]}
serde-saphyr = "0.0.6"
#serde_json = "1.0.145"
serde_json = { package = "serde_json_path_to_error", version = "0.1.5" }
subst = "0.3.8"
tokio = { version = "1.48.0", features = ["macros", "process", "rt", "tracing"] }
tokio-process-tools = "0.7.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = [] }
